<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEME OS — Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Lucide Icons – optional; app.js will handle safely if undefined -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body class="login-page">
    <div class="login-bg-elements" id="loginBgElements" aria-hidden="true"></div>

    <div class="login-container">
        <div class="login-left">
            <div class="login-brand">
                <div class="brand-logo">
                    <span class="brand-symbol">◈</span>
                </div>
                <h1 class="brand-name">MEME&nbsp;OS</h1>
            </div>
            <div class="login-tagline">
                <h2>Meme coin intelligence,<br />without the noise.</h2>
                <p>Discover. Analyze. Track. Improve.</p>
            </div>
            <div class="login-features">
                <div class="feature-item">
                    <i data-lucide="radar" class="feature-icon"></i>
                    <span>Live DEX Screener data</span>
                </div>
                <div class="feature-item">
                    <i data-lucide="shield-check" class="feature-icon"></i>
                    <span>Risk intelligence scoring</span>
                </div>
                <div class="feature-item">
                    <i data-lucide="line-chart" class="feature-icon"></i>
                    <span>Trade analytics & journal</span>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-card">
                <h3>Welcome back</h3>
                <p class="login-subtitle">Sign in to your terminal</p>

                <form id="loginForm" class="login-form" autocomplete="off">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" value="demo@memeos.local" placeholder="demo@memeos.local" required />
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" value="demo123" placeholder="••••••••" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <i data-lucide="log-in" class="btn-icon"></i>
                        Sign In
                    </button>
                </form>

                <div class="demo-mode-badge">
                    <i data-lucide="flask-conical" class="demo-icon"></i>
                    <span>DEMO MODE — Use credentials above</span>
                </div>

                <div class="login-error" id="loginError" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Main app logic (handles login, icons, etc.) -->
    <script src="app.js"></script>
</body>
</html>
